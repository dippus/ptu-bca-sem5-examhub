<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKGPTU BCA Sem-5 Master Exam & Syllabus Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #111827;
            --surface-hover: #1f293d;
            --border: #233152;
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(16px);
        }

        .header-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo-title h1 {
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-switch-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            gap: 6px;
        }

        .view-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.4);
        }

        .main-layout {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 24px;
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 28px;
            flex: 1;
            width: 100%;
        }

        @media (max-width: 968px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar Tabs */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sub-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            text-align: left;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .sub-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .sub-btn.active {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.25) 0%, rgba(14, 165, 233, 0.15) 100%);
            border-color: var(--primary-light);
            color: var(--text-main);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
        }

        .sub-btn.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary-light);
        }

        .sub-name {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .sub-code {
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            color: var(--accent);
        }

        .unit-nav {
            display: flex;
            gap: 10px;
            background: var(--surface);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin-bottom: 20px;
        }

        .unit-btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-align: center;
        }

        .unit-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .unit-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.4);
        }

        /* Syllabus View Styling */
        .syllabus-overview-card {
            background: linear-gradient(135deg, #131b2e 0%, #0d1527 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .info-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 12px 16px;
            border-radius: 10px;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .info-val {
            font-size: 1rem;
            font-weight: 700;
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
        }

        .unit-block-syllabus {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .unit-block-syllabus:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }

        .syllabus-unit-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .syllabus-unit-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .topic-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.45;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .topic-chip::before {
            content: '📌';
            font-size: 0.9rem;
        }

        /* Question Cards */
        .q-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .q-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
            background: var(--surface-hover);
        }

        .q-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.5;
        }

        .q-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tag-pyq {
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-weight: 500;
        }

        .tag-high {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 24px 0 14px 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .badge-2m {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-10m {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }
    </style>
</head>

                <button class="unit-btn" onclick="switchUnit('all')">View All Units</button>

            <div id="content-container"></div>
        </main>
    </div>
